download_choice = Which to choose?
download_help = <b>Floppy disk image (.img)</b> - the compact option, suitable
    for emulators and for booting from a real floppy disk.
    \n
    <b>LiveCD image (.iso)</b> - the best choice for a beginner, write it to a
    CD or a flash drive and the system boots straight from it.
    \n
    <b>Hybrid UEFI/BIOS image (.raw)</b> - same as the LiveCD, but it can also
    boot via UEFI, which is required on newer devices.
    \n
    <b>Flash/Multi-boot distribution (.zip)</b> - an archive with the system
    files for manual installation onto a flash drive or a disk.

download_description = On this page you can download the nightly builds
    distribution, which means that they always contain the most recent changes
    in the system and can, therefore, be unstable. All files are compressed with
    {zip}. {kolibrios} is distributed under {gpl} license, its source code is
    available on our {git}.
git-server = Git server

