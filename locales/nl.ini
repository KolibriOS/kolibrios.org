download_help = <b>Diskette-image (.img)</b> - de compacte variant, geschikt
    voor emulators en om vanaf een echte diskette op te starten.
    \n
    <b>LiveCD-image (.iso)</b> - de beste keuze voor een beginner, je
    schrijft hem naar een cd of een usb-stick en het systeem start er direct
    vanaf.
    \n
    <b>Hybride UEFI/BIOS-image (.raw)</b> - hetzelfde als de LiveCD, maar kan
    ook via UEFI opstarten, wat op nieuwere apparaten nodig is.
    \n
    <b>Flash/Multi-boot-distributie (.zip)</b> - een archief met de
    systeembestanden voor handmatige installatie op een usb-stick of schijf.

download_description = Op deze pagina kunt u de nightly builds-distributie
    downloaden, wat betekent dat ze altijd de meest recente wijzigingen in het
    systeem bevatten en daarom onstabiel kunnen zijn. Alle bestanden zijn
    gecomprimeerd met {zip} wordt verspreid onder de {gpl}-licentie, en de
    broncode is beschikbaar op onze {git}.
