download_choice = ¿Cuál elegir?
download_help = <b>Imagen de disquete (.img)</b> - la opción compacta, apta
    para emuladores y para arrancar desde un disquete real.
    \n
    <b>Imagen LiveCD (.iso)</b> - la mejor opción para principiantes, se graba
    en un CD o en una memoria USB y el sistema arranca directamente desde ahí.
    \n
    <b>Imagen híbrida UEFI/BIOS (.raw)</b> - igual que el LiveCD, pero también
    puede arrancar mediante UEFI, lo que es necesario en los equipos nuevos.
    \n
    <b>Distribución Flash/Multi-boot (.zip)</b> - un archivo con los ficheros
    del sistema para la instalación manual en una memoria USB o en un disco.

download_description = En esta página puedes descargar la distribución de
    compilaciones nocturnas, lo que significa que siempre contienen los cambios
    más recientes en el sistema y, por lo tanto, pueden ser inestables. Todos
    los archivos están comprimidos con {zip}. {kolibrios} se distribuye bajo la
    licencia {gpl} y su código fuente está disponible en nuestro {git}.
